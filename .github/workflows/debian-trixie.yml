name: Debian Trixie CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, run unit tests and publish
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      BUILD_TARGET: linux-x86_64-trixie
      BUILD_CONFIG: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libusb-1.0-0-dev \
            build-essential \
            ca-certificates \
            cmake \
            doxygen \
            git \
            python3 \
            python3-xmlschema \
            clang \
            clang-format \
            clang-tidy \
            cppcheck

      - name: Fetch and compile the application
        shell: bash
        run: ./Build.sh all

      - name: Run static checks
        shell: bash
        run: ./Build.sh check

      - name: Generate documentation
        shell: bash
        run: ./Build.sh doc

      - name: Run unit tests
        shell: bash
        run: ./Build.sh utest

      - name: Publish successful artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-trixie-dist
          path: dist/
