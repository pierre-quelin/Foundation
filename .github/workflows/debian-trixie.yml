name: Debian Trixie CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pages: write
  id-token: write

jobs:
  build-test-publish:
    name: Build, run unit tests and publish
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      BUILD_TARGET: linux-x86_64-trixie
      BUILD_CONFIG: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libusb-1.0-0-dev \
            build-essential \
            ca-certificates \
            cmake \
            doxygen \
            graphviz \
            git \
            python3 \
            python3-xmlschema \
            clang \
            clang-format \
            clang-tidy \
            cppcheck

      - name: Fetch and compile the application
        shell: bash
        run: ./Build.sh all

      - name: Run static checks
        shell: bash
        run: ./Build.sh check

#      - name: Publish Cppcheck reports
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: sample-trixie-cppcheck-reports
#          path: |
#            dist/cppcheck-result.xml
#            dist/cppcheck-results.sarif
#          if-no-files-found: ignore

      - name: Run unit tests
        shell: bash
        run: ./Build.sh utest

      - name: Generate documentation
        shell: bash
        run: ./Build.sh doc

      - name: Upload documentation for GitHub Pages
        if: success() && (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/html

      - name: Publish successful artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-trixie-dist
          path: dist/

  deploy-docs:
    name: Deploy documentation
    needs: build-test-publish
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
