name: MinGW64 UCRT CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, run unit tests and publish

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.13']

    env:
      BUILD_TARGET: mingw64
      BUILD_CONFIG: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip and requirements
        run: |
          python -m ensurepip --upgrade
          pip --version
          python -m pip install -r tools\requirements.txt

      - name: Setup MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            clang:p
            clang-tools-extra:p
            cppcheck:p
            doxygen:p
            graphviz:p
            libusb:p

      - name: Fetch and compile the application
        shell: cmd
        run: .\Build.bat all

      - name: Run static checks
        shell: cmd
        run: .\Build.bat check

      - name: Generate documentation
        shell: cmd
        run: .\Build.bat doc

      - name: Run unit tests
        shell: cmd
        run: .\Build.bat utest

      - name: Publish successful artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-mingw64-ucrt-dist
          path: dist/
