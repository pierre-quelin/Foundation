name: Windows MSVC19 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, run unit tests and publish
    runs-on: windows-2019
    env:
      BUILD_TARGET: msvc16-x86_64
      BUILD_CONFIG: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools\requirements.txt
          choco install -y doxygen
          choco install -y cmake

      - name: Fetch and compile the application
        shell: cmd
        run: .\Build.bat all

      - name: Run static checks
        shell: cmd
        run: .\Build.bat check

      - name: Generate documentation
        shell: cmd
        run: .\Build.bat doc

#      - name: Run unit tests
#        shell: cmd
#        run: .\Build.bat utest

      - name: Publish successful artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-msvc19-dist
          path: dist/
